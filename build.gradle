plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    // RetroFuturaGradle: modern 1.12.2 modding (replaces dead ForgeGradle 2.3)
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

// ---------------------------------------------------------------------------
// Mod metadata
// ---------------------------------------------------------------------------
version = mod_version
group = root_package
base {
    archivesName = mod_id
}

// ---------------------------------------------------------------------------
// Toolchain: compile for Java 8 (1.12.2 requires it). Azul covers all platforms.
// The Gradle daemon itself runs on a newer JDK (17+); RFG provisions JDK8.
// ---------------------------------------------------------------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
    withSourcesJar()
}

// ---------------------------------------------------------------------------
// RFG / Minecraft configuration
// ---------------------------------------------------------------------------
minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'           // same MCP mapping as the original 1.12 project
    username = 'Developer'

    extraRunJvmArguments.add('-ea:' + group)
    extraRunJvmArguments.add('-Dfml.queryResult=confirm')
    extraRunJvmArguments.add('-Dfml.doNotBackup=true')
}

// ---------------------------------------------------------------------------
// Repositories (CN mirrors first for speed)
// ---------------------------------------------------------------------------
repositories {
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    mavenLocal()
    // JEI / compat mods
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

// ---------------------------------------------------------------------------
// Extra source sets
// tridentApi: optional Trident mod API stubs (compile only, never shipped).
// silentlib: the bundled Silent Lib sources, compiled but never packed into this mod.
// ---------------------------------------------------------------------------
sourceSets {
    tridentApi {
        java.srcDir 'src/tridentApi/java'
        // Reuse the main compile classpath (Minecraft, Forge, JEI), but never its output.
        compileClasspath += sourceSets.main.compileClasspath
    }
    // Silent Lib is a separate mod with its own modid, not part of Silent Gear's artifact. Its
    // sources stay in the repository but are compiled outside the main source set, so they never
    // reach the mod jar or the dev launch classpath (either would register a duplicate silentlib).
    // Conventional dirs: src/silentlib/java and src/silentlib/resources.
    silentlib {
        compileClasspath += sourceSets.main.compileClasspath
    }
}

// Feed the stub and library classes to the main compilation only. Adding them at the task level
// (instead of a dependency configuration) prevents a circular task graph and keeps them off the
// runtime classpath: a second @Mod("silentlib") there would be a duplicate mod.
tasks.named('compileJava').configure {
    dependsOn tasks.named('tridentApiClasses'), tasks.named('silentlibClasses')
    classpath = classpath + sourceSets.tridentApi.output + sourceSets.silentlib.output
}

// The bundled Silent Lib sources use Lombok, same as the main source set.
tasks.named('compileSilentlibJava', JavaCompile).configure {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// Reobfuscation decides whether a method overrides a Minecraft method by walking the class
// hierarchy. Classes of the compile-only source sets are not in the jar, so without them on the
// reference classpath every override inherited through one of them keeps its MCP name and blows
// up with AbstractMethodError in production (e.g. IRecipe.getRecipeOutput). Every extra source
// set is therefore added here automatically; only main is already part of the jar.
tasks.withType(com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar).configureEach {
    sourceSets.each { extra ->
        if (extra != sourceSets.main && extra != sourceSets.test) {
            referenceClasspath.from(extra.output.classesDirs)
        }
    }
}

// ---------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------
dependencies {
    // Lombok (used by the original Silent Gear codebase; 1.18.34 supports modern JDK8 toolchains)
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // JEI (optional compat, deobfed for dev)
    compileOnly rfg.deobf('mezz.jei:jei_1.12.2:4.14.4.259:api')
}

// ---------------------------------------------------------------------------
// Resources: fill mcmod.info placeholders
// ---------------------------------------------------------------------------
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

// ---------------------------------------------------------------------------
// Compilation (encoding only; Java 8 target is handled by the toolchain above)
// ---------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.mod_id,
            'Implementation-Version': project.version,
        )
    }
}

// ---------------------------------------------------------------------------
// Dev-only Silent Lib jar
// FML discovers mods on the launch classpath, so the bundled library classes must not be there.
// Instead they are packaged into a standalone jar inside the run directory, where FML finds it
// exactly like a user-installed Silent Lib. This never affects the published artifact.
// ---------------------------------------------------------------------------
def devSilentLibJar = tasks.register('devSilentLibJar', Jar) {
    group = 'minecraft'
    description = 'Packages the bundled Silent Lib sources as a standalone mod jar in run/mods'
    archiveFileName = 'SilentLib-3.0.13.jar'
    destinationDirectory = layout.projectDirectory.dir('run/mods')
    from sourceSets.silentlib.output
    manifest {
        attributes('Implementation-Title': 'SilentLib', 'Implementation-Version': '3.0.13')
    }
}

// Both dev run configurations need Silent Lib to be present and current.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn devSilentLibJar
}
